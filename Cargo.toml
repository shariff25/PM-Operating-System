[workspace]
resolver = "2"
members = ["crates/contract", "crates/cli", "crates/runtime", "crates/toolserver", "crates/docs", "crates/slack", "crates/gateway", "crates/bots", "crates/console", "crates/evals", "crates/policy", "crates/web", "crates/assertion", "crates/stack-tests", "crates/directory", "crates/entra"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
aes-gcm = "0.10"
# Password sign-in (docs/password-sign-in.md): Argon2id from RustCrypto, with its output and
# inputs zeroized; no random-number feature (salts come from getrandom).
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
getrandom = "0.3"
# TOTP (RFC 6238) is HMAC-SHA-1.
sha1 = "0.10"
zeroize = "1.8"
# The password rules read a password in NFKC for the name and common-list checks only (never
# what is hashed). Already in the lock through sqlx's stringprep.
unicode-normalization = "0.1.26"
subtle = "2.6"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
croner = "4.0"
hmac = "0.12"
# Entra ID tokens (RS256) through aws-lc-rs, which rustls already uses: no OpenSSL. Shared by
# pmos-web and the tool server through pmos-entra.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
pmos-assertion = { path = "crates/assertion" }
pmos-contract = { path = "crates/contract" }
pmos-directory = { path = "crates/directory" }
pmos-entra = { path = "crates/entra" }
pmos-evals = { path = "crates/evals" }
pmos-policy = { path = "crates/policy" }
pmos-runtime = { path = "crates/runtime" }

# Line tables keep backtraces readable at a fraction of the disk (full debug info made the
# test binaries ~20 GB).
[profile.dev]
debug = "line-tables-only"

# Argon2id at OWASP's parameters takes seconds per hash unoptimized; tests hash often.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
