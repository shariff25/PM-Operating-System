[workspace]
resolver = "2"
members = ["crates/contract", "crates/cli"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tempfile = "3"
thiserror = "2"
walkdir = "2"
pmos-contract = { path = "crates/contract" }
