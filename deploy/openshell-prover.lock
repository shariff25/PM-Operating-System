# The OpenShell policy prover that CI's `policy-prover` job and `pmos-admin policy prove` may run
# (docs/openshell-prover-and-sandbox-audit-spec.md §A.7). Read as data (KEY=value; never sourced).
#
# PINNED BY SOURCE (2026-11-24). The prover is built from exactly this commit of OpenShell's
# repository; nobody has verified OpenShell's release archives (their downloads were refused from
# where this was pinned), so nothing here depends on them.
#   - PROVER_SOURCE_COMMIT is the full commit the tag v0.1.10 named on 2026-11-24 (a lightweight
#     tag; `git ls-remote --tags` showed v0.1.10 and v0.1.10-pre.8 at this commit). CI fetches the
#     tag and FAILS if it names any other commit: a moved tag is never built.
#   - PROVER_VERSION is what the built `openshell-prover --version` prints ("openshell-prover
#     0.1.10"). OpenShell's workspace says 0.0.0 in the source; its release build stamps the
#     version into Cargo.toml with sed, and scripts/build-openshell-prover.sh does the same (and in
#     Cargo.lock, so the build stays --locked). An unstamped build prints 0.0.0 and is refused as
#     `version_mismatch` ("too old").
#   - PROVER_Z3_FEATURE: Z3 is built from the z3-src crate that the source's Cargo.lock pins by
#     checksum (needs cmake and a C++ compiler). Only vendored-z3 is accepted.
#   - The Rust toolchain is the one the source pins (rust-toolchain.toml: 1.95.0 at this commit).
# A source build's binary SHA-256 isn't known in advance: the build writes a build record (the
# commit, the version, the binary's SHA-256) and `pmos policy prove --build-record` refuses the
# binary unless the record names this commit and version and the binary has the record's hash.
# The build is done in the same CI job that proves; on a host, `PMOS_PROVER_BUILD_RECORD` names
# the record the host's own build wrote.
#
# Optional, empty: a release archive instead (PROVER_RELEASE_TAG, PROVER_ARCHIVE_SHA256_<ARCH>,
# PROVER_BINARY_SHA256_<ARCH>), used by CI only when no source commit is pinned. Fill in only from
# a release someone has downloaded and checked (archive and extracted binary), in its own pull
# request under CODEOWNERS.
#
# A bump (another tag and commit) is its own pull request; CI then builds the old and the new
# prover and fails if any bot's status differs (PRV-8).
PROVER_VERSION=0.1.10
PROVER_SOURCE_REPO=https://github.com/NVIDIA/OpenShell
PROVER_SOURCE_TAG=v0.1.10
PROVER_SOURCE_COMMIT=152c59d3178039e3fbb4a5595f9fff7216a6be92
PROVER_Z3_FEATURE=vendored-z3
PROVER_RELEASE_TAG=
PROVER_ARCHIVE_SHA256_X86_64=
PROVER_ARCHIVE_SHA256_AARCH64=
PROVER_BINARY_SHA256_X86_64=
PROVER_BINARY_SHA256_AARCH64=
# The OpenShell version whose OCSF records the sandbox-audit collector's parsing was last verified
# on (spec §B.8): empty until the host acceptance run (slice B6). Until then every OpenShell version
# the collector sees is recorded once as "format unverified".
OPENSHELL_FORMAT_VERIFIED=
