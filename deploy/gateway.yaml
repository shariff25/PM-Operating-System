# PM OS gateway on the Spark: the roles served by the vLLM containers in deploy/compose.yaml.
# Same roles as config/gateway.yaml; only the upstream addresses differ (compose service names).
# Confirm the served model names on the Spark before first use; swapping a model is
# docs/runbooks/model-swap.md.
#
# The `model` of each role here is the PRODUCTION ROLE MODEL: an eval report counts towards a
# bar (the two-weeks rule, and a marketplace bot's `benchmarked: true`) only when the models
# the gateway reported for that run match these, role for role (docs/evals.md, "Which runs
# count"). Swapping a model here therefore restarts every benchmark streak.
#
# `class: production` marks this as the Spark's own gateway: it reports it in
# GET /v1/pmos/roles, and an eval report counts towards a bar only when the runtime under test
# reports a production-class gateway (docs/evals.md, "Which runs count"). A production gateway
# refuses testing-only upstreams, `local-hosts`, and any model server not named
# `<name>.pmos.internal` (the vLLM services' aliases in deploy/compose.yaml) at start-up.
# With the stub model on (PMOS_GATEWAY_STUB=1, a first install's default until the model
# servers are up) it still starts, warns, and reports class `test`, so no eval run against a
# stub counts.
class: production
upstreams:
  qwen: http://vllm-default.pmos.internal:8000/v1
  nemotron: http://vllm-extraction.pmos.internal:8000/v1
roles:
  default:
    upstream: qwen
    model: qwen3.6-35b-a3b
    workarounds: [strip-think]
  # The PM assistant's drafting and critique. Point it at a larger model if the bake-off picks one.
  reasoning:
    upstream: qwen
    model: qwen3.6-35b-a3b
    workarounds: [strip-think]
  extraction:
    upstream: nemotron
    model: nemotron-3-nano-30b-a3b
limits:
  max-in-flight: 4
  per-user: 2
  max-queue: 64
  # How long a call may wait for a slot (then 503 with Retry-After), how long a streamed
  # answer may take in all, and the largest answer taken from a model server. These are the
  # defaults, written out (docs/gateway.md, "Sharing the GPU").
  queue-wait-secs: 300
  stream-max-secs: 900
  max-answer-bytes: 16777216
  # How many calls one person may have waiting for a slot (the default, twice per-user). Each
  # client may have twice its max-in-flight waiting (its `max-queue`), so no one token fills
  # the queue (review finding R2).
  per-user-queue: 4
# Who may say which person a call is for (X-Pmos-User) and how urgent it is (X-Pmos-Priority),
# and how many calls each client token may have in flight (review findings N3 and N4). A client
# not listed here is not trusted: its calls are keyed by its own name, run as `personal`, and
# hold at most `per-user` (2) slots.
clients:
  # The bot runtime: it parses routines for the PM its caller verified.
  runtime: {trusted: true, max-in-flight: 2}
  # Each PM's own bot's worker (bot-pm-<handle>): it may name only the PM its name spells
  # (`user: from-name`; naming anyone else is 403, in the usage log; review finding R1).
  bot-pm-*: {trusted: true, max-in-flight: 3, user: from-name}
  # Each team bot's worker (bot-docs, ...): it names the PM whose task it runs, any PM. At most
  # 3 of the 4 slots each, so no one bot's token holds them all.
  bot-*: {trusted: true, max-in-flight: 3}
  # The eval stack (deploy/compose.evals.yaml): its runtime, workers and judges share this
  # token. One slot, background priority, so a benchmark never takes production's capacity.
  evals: {max-in-flight: 1, priority: personal}
