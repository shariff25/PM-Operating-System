# TESTING ONLY: the gateway on a hosted OpenAI-compatible model nobody approved
# (PMOS_MODEL_SOURCE=hosted-test; docs/openshell-any-host-spec.md §3.6, "hosted-test, and
# fake-data mode"). Prompts leave this host, so the stack takes fake data only.
#
# deploy/pmos-admin adds this file to every `docker compose` call when deploy/.env says
# PMOS_MODEL_SOURCE=hosted-test, and writes the gateway's config, a `class: test` one with every
# role on PMOS_HOSTED_TEST_MODEL behind its label, to $PMOS_STATE_DIR/gateway.hosted-test.yaml
# (outside the repo: it names the provider's URL and model id). This is the gateway's part of
# slice H4 only; the services' own fake-data refusals are still H4's.
services:
  gateway:
    environment:
      # The host's outbound proxy, if it has one, as for the other services (x-proxy).
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,.pmos.internal,postgres,vllm-default,vllm-extraction,${NO_PROXY:-}
      PMOS_GATEWAY_CLOUD_TEST: "1"
      PMOS_GATEWAY_REMOTE_KEY: ${PMOS_GATEWAY_REMOTE_KEY:?PMOS_MODEL_SOURCE=hosted-test needs PMOS_GATEWAY_REMOTE_KEY in deploy/.env}
    volumes:
      - ${PMOS_STATE_DIR:?}/gateway.hosted-test.yaml:/etc/pmos/gateway.yaml:ro
