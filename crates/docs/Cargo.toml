[package]
name = "pmos-docs"
description = "PM OS docs server: indexes the Acme support docs and serves search over MCP"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.88"

[[bin]]
name = "pmos-docs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
pmos-contract.workspace = true
reqwest.workspace = true
rmcp = { version = "3.10", features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
rmcp = { version = "3.10", features = ["client", "transport-streamable-http-client-reqwest"] }
