[package]
name = "pmos-web"
description = "PM OS web client back end: local accounts, server-side sessions and admin user management"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.88"

[[bin]]
name = "pmos-web"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
getrandom = "0.3"
hmac.workspace = true
pmos-contract.workspace = true
pmos-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
