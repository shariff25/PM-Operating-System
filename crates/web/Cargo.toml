[package]
name = "pmos-web"
description = "PM OS web app backend: sessions and the /api the web app calls"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.88"

[[bin]]
name = "pmos-web"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
# Session ids and CSRF tokens: 256 bits from the operating system's generator.
getrandom = "0.3"
hmac.workspace = true
# Entra ID tokens (RS256) through aws-lc-rs, which rustls already uses: no OpenSSL.
jsonwebtoken ={ version = "10", default-features = false, features = ["aws_lc_rs"] }
pmos-assertion.workspace = true
pmos-contract.workspace = true
# The admin policy screens: generate and check sandbox policies on a proposed change.
pmos-policy.workspace = true
pmos-runtime.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
# Git blob ids (`blob <len>\0<bytes>`), to tell a proposal's base from the default branch's files.
sha1 = "0.10"
sha2.workspace = true
sqlx.workspace = true
# A scratch copy of the content tree for validating a proposed change.
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

[dev-dependencies]
