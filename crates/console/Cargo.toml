[package]
name = "pmos-console"
description = "PM OS console: a small server-rendered web view of bots, routines, approvals and activity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.88"

[[bin]]
name = "pmos-console"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util = "0.3"
hmac.workspace = true
pmos-assertion.workspace = true
pmos-contract.workspace = true
pmos-runtime.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
# Contract test: the console reads audit lines exactly as the tool server writes them.
pmos-toolserver = { path = "../toolserver" }
tempfile.workspace = true
tokio-util.workspace = true
