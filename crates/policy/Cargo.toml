[package]
name = "pmos-policy"
description = "PM OS sandbox policies: one NVIDIA OpenShell policy per bot, generated and checked"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
# Server-made proposal branch names (`admin::proposals::branch_name`).
getrandom = "0.3"
pmos-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
# Git blob ids (`blob <len>\0<bytes>`), to tell a proposal's base from the default branch's files.
sha1 = "0.10"
sha2.workspace = true
# A scratch copy of the content tree for validating a proposed change (`admin`).
tempfile.workspace = true
walkdir.workspace = true
