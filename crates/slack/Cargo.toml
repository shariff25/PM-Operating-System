[package]
name = "pmos-slack"
description = "PM OS Slack bot: Socket Mode client for the bots (DMs, approval cards, routines) and /docs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.88"

[[bin]]
name = "pmos-slack"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
base64.workspace = true
futures-util = "0.3"
pmos-contract.workspace = true
pmos-runtime.workspace = true
reqwest.workspace = true
rustls = "0.23"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-util.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
pmos-toolserver = { path = "../toolserver", features = ["test-support"] }
tempfile.workspace = true
