[package]
name = "pmos-slack"
description = "PM OS Slack bot: Socket Mode client, /docs today, the full bot in Phase 1"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.88"

[[bin]]
name = "pmos-slack"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
futures-util = "0.3"
pmos-contract.workspace = true
reqwest.workspace = true
rustls = "0.23"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
chrono.workspace = true
pmos-toolserver = { path = "../toolserver" }
tempfile.workspace = true
tokio-util.workspace = true
