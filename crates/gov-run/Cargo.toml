[package]
name = "gov-run"
description = "Agent Governance: the programs to run. `gov-ledger` serves the Ledger and publishes checkpoints; `gov-gate` serves the MCP gate in observe mode and ships its receipts."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "gov-ledger"
path = "src/bin/gov-ledger.rs"

[[bin]]
name = "gov-gate"
path = "src/bin/gov-gate.rs"

[[bin]]
name = "gov-shim"
path = "src/bin/gov-shim.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
axum.workspace = true
clap.workspace = true
gov-core = { path = "../gov-core" }
gov-gate = { path = "../gov-gate" }
gov-ledger = { path = "../gov-ledger" }
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
sqlx.workspace = true
tempfile.workspace = true
uuid.workspace = true
