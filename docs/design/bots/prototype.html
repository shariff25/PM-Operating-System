<title>PM OS Bot Marketplace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: the PM OS shell (dark rail, light canvas); a prototype of the planned bot marketplace. One deliberate light look, matching the app. */
:root{--bg:#f6f6f2;--surface:#fff;--soft:#fafaf7;--chip:#f1f1ec;--ink:#121614;--muted:#5b645f;--line:#e2e3dc;--rail:#0b0f0e;--accent:#0b7a53;--accent-ink:#0a5c3f;--warn-bg:#fbf0da;--warn-ink:#7a4a00;--sys-bg:#e8eefd;--sys-ink:#1d3fa8;--slack-bg:#f1eafb;--slack-ink:#5b2ba8;--bad:#9b2c1f;color-scheme:light}
*{box-sizing:border-box}html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:#e8ebe7;padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;padding:4px 8px 16px}.brand i{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.nav{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border-radius:9px;color:#b9c0bb;display:flex;justify-content:space-between;align-items:center}.nav[aria-current=page]{background:#1b2320;color:#fff}.nav:focus-visible{outline:2px solid #6fe0b0}
main{padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.eyebrow{font:500 11.5px "Geist Mono",ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-size:30px;letter-spacing:-.02em;margin:6px 0;font-weight:650;text-wrap:balance}h2{font-size:17px;margin:0}h3{margin:2px 0 0;font-size:18px}
.sub{color:var(--muted);margin:0;max-width:65ch}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}
.bot{padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.bot.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 16%,transparent)}
.art{height:136px;display:grid;place-items:center;background:var(--soft);border-radius:12px}.art svg{max-width:100%;height:auto}
.role{font:500 11px "Geist Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.bot p{margin:0;color:#3c4540;font-size:14px}
.asks{display:flex;flex-direction:column;gap:6px}.ask{font-size:13px;background:var(--chip);border-radius:8px;padding:7px 10px}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.chip{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--sys-bg);color:var(--sys-ink)}.chip.s{background:var(--slack-bg);color:var(--slack-ink)}.chip.w{background:var(--warn-bg);color:var(--warn-ink)}
.btn{font-weight:600;font-size:14px;border-radius:10px;padding:10px 14px;border:1px solid #d4d6ce;background:var(--surface);text-align:center}.btn.on{background:var(--rail);color:#fff;border-color:var(--rail)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.sm{padding:7px 12px}.btn.bad{color:var(--bad)}.btn[disabled]{color:var(--muted);background:var(--soft);cursor:default}
.tick{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.bar{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 16px;flex-wrap:wrap}.bar .grow{flex:1;min-width:220px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid #eeefe9;flex-wrap:wrap}.row:first-child{border-top:0}.row .grow{flex:1;min-width:180px}
.note{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:20px;align-items:start}
.askbox{padding:18px;margin-top:18px;position:relative}.askrow{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:8px;border:1px solid #d4d6ce;border-radius:10px;padding:6px 10px;font-weight:600;background:var(--surface)}
.askrow input{flex:1;min-width:180px;font:inherit;font-size:17px;border:0;outline:0;background:transparent;color:var(--ink);padding:8px 0}
.menu{position:absolute;z-index:5;left:18px;top:96px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(16,35,26,.16);padding:6px;width:min(330px,calc(100% - 36px))}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:9px;width:100%}.mi:hover,.mi:focus-visible{background:var(--chip)}.mi small{display:block;color:var(--muted);font-size:12.5px}.mi .end{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent-ink)}
.pill{font:500 11px "Geist Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:4px 8px;background:var(--sys-bg);color:var(--sys-ink)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--rail);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media (max-width:760px){.app{grid-template-columns:1fr}.rail{flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px}.brand{padding:4px 8px}.wrap{padding:0}}
</style>
<div class="app"><aside class="rail"><div class="brand"><i>P</i>PM OS</div><nav id="nav" style="display:contents"></nav></aside><main><div class="wrap" id="view"></div></main></div>
<div id="toast" class="toast" hidden role="status"></div>

0 0 0 0 -50 -50z\" fill=\"#fff\"/>\n<ellipse cx=\"40\" cy=\"124\" rx=\"15\" ry=\"9\" fill=\"#FF9DB0\" opacity=\".75\"/><ellipse cx=\"160\" cy=\"124\" rx=\"15\" ry=\"9\" fill=\"#FF9DB0\" opacity=\".75\"/><ellipse cx=\"70\" cy=\"90\" rx=\"27\" ry=\"31\" fill=\"#fff\"/><circle cx=\"70\" cy=\"94\" r=\"14\" fill=\"#10231A\"/><circle cx=\"75\" cy=\"88\" r=\"5\" fill=\"#fff\"/><ellipse cx=\"130\" cy=\"90\" rx=\"27\" ry=\"31\" fill=\"#fff\"/><circle cx=\"130\" cy=\"94\" r=\"14\" fill=\"#10231A\"/><circle cx=\"135\" cy=\"88\" r=\"5\" fill=\"#fff\"/><path d=\"M84 132 q16 16 32 0\" fill=\"none\" stroke=\"#10231A\" stroke-width=\"7\" stroke-linecap=\"round\"/></svg>", "col": "#F0654A"}];
const S={view:'pick',team:new Set(['nudge']),asking:'nudge',menu:false,detail:'chief',drafts:[['Confluence','PRD: grace period setting','Confluence page · drafted yesterday','nudge'],['Slack','Reply to Ben about the pricing page','Slack reply · 22 h left','nudge']]};
const by=k=>BOTS.find(b=>b.k===k), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chips=b=>b.reads.map(r=>`<span class="chip${r==='Slack'?' s':''}">${r}</span>`).join('')+(b.need?`<span class="chip w">${b.need}</span>`:'');
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}
function nav(){const items=[['pick','Getting started'],['today','Today'],['bots','Bots']];document.getElementById('nav').innerHTML=items.map(([v,l])=>`<button class="nav" data-go="${v}" ${S.view===v?'aria-current="page"':''}>${l}${v==='bots'?`<span class="note" style="color:#8d9590">${S.team.size}</span>`:''}</button>`).join('');}
const banner='<div class="banner"><b>Prototype.</b> This shows the planned bot marketplace so you can click through it. It is not built into PM OS yet, and nothing here is saved.</div>';
function pick(){const names=[...S.team].map(k=>by(k).name);return banner+`<div class="eyebrow">Getting started · step 1 of 3</div><h1>Pick your team</h1><p class="sub">Each bot is good at one kind of product work. Choose the ones you want. You can change this any time.</p>
<div class="grid">${BOTS.map(b=>{const sel=S.team.has(b.k);return `<section class="card bot ${sel?'sel':''}" style="--c:${b.col}">${sel?'<div class="tick" aria-hidden="true">✓</div>':''}<div class="art">${b.big}</div><div><div class="role">${b.role}</div><h3>${b.name}</h3></div><p>${b.desc}</p><div class="asks">${b.asks.map(a=>`<div class="ask">“${a}”</div>`).join('')}</div><div class="meta">Reads ${chips(b)}</div>${b.fixed?'<button class="btn" disabled>Always on your team</button>':`<button class="btn ${sel?'on':''}" data-toggle="${b.k}" aria-pressed="${sel}">${sel?'Added · remove':'Add to my team'}</button>`}</section>`}).join('')}</div>
<div class="card bar">${by('nudge').face}<div class="grow"><b>${S.team.size} on your team:</b> ${names.join(', ')}. <span class="note">Each one drafts; nothing is sent anywhere until you approve it.</span></div><button class="btn pri" data-go="today">Continue with ${S.team.size} ${S.team.size===1?'bot':'bots'} →</button></div>`;}
function today(){const a=by(S.asking);return banner+`<div class="eyebrow">Today</div><h1>Good morning, Ana. ${S.drafts.length} things need you.</h1>
<div class="card askbox"><div class="eyebrow">What do you need?</div><div class="askrow"><button class="pick" data-menu aria-haspopup="true" aria-expanded="${S.menu}">${a.face.replace('width="40"','width="26"').replace('height="40"','height="26"')} ${a.name} <span class="note">▾</span></button><input id="q" aria-label="Ask ${a.name}" placeholder="${esc(a.asks[0])}"><button class="btn pri" data-send>Send →</button></div>
<div class="askrow" style="margin-top:14px">${a.asks.map(x=>`<button class="ask" style="border:0" data-fill="${esc(x)}">${x}</button>`).join('')}</div>
${S.menu?`<div class="menu" role="menu"><div class="eyebrow" style="padding:8px 10px 6px">Ask</div>${BOTS.map(b=>{const on=S.team.has(b.k);return `<button class="mi" role="menuitem" data-ask="${b.k}" style="${on?'':'color:#8d9590'}">${b.face.replace('width="40"','width="28"').replace('height="40"','height="28"')}<span><b>${b.name}</b><small>${b.role}${on?'':' · not on your team'}</small></span><span class="end">${on?(b.k===S.asking?'✓':''):'Add'}</span></button>`}).join('')}</div>`:''}</div>
<div class="card" style="margin-top:20px"><div class="row"><h2 class="grow">Needs your decision</h2><span class="note">${S.drafts.length}</span></div>${S.drafts.map(d=>`<div class="row"><span class="pill" ${d[0]==='Slack'?'style="background:var(--slack-bg);color:var(--slack-ink)"':''}>${d[0]}</span><div class="grow"><b>${esc(d[1])}</b><div class="note">${d[2]}</div></div><span class="note" style="display:flex;align-items:center;gap:7px">${by(d[3]).face.replace('width="40"','width="24"').replace('height="40"','height="24"')} ${by(d[3]).name}</span><button class="btn sm" data-review>Review</button></div>`).join('')}</div>`;}
function bots(){const on=BOTS.filter(b=>S.team.has(b.k)),off=BOTS.filter(b=>!S.team.has(b.k)),d=by(S.detail);
const row=(b,right)=>`<div class="row"><button class="mi" style="width:auto;flex:1;min-width:180px" data-detail="${b.k}">${b.face}<span><b>${b.name}</b> <span class="note">· ${b.role}</span><small>${b.desc}</small></span></button>${right}</div>`;
return banner+`<div class="eyebrow">Your team</div><h1>Bots</h1><p class="sub">The bots that work for you. Add one when you need it; remove one and its drafts stay yours.</p>
<div class="two"><div><div class="card"><div class="row"><h2 class="grow">On your team</h2><span class="note">${on.length}</span></div>${on.map(b=>row(b,b.fixed?'<span class="note">Always on</span>':`<button class="btn sm bad" data-toggle="${b.k}">Remove</button>`)).join('')}</div>
<div class="card" style="margin-top:18px"><div class="row"><h2 class="grow">Available</h2><span class="note">${off.length}</span></div>${off.length?off.map(b=>row(b,(b.need?`<span class="chip w">${b.need}</span>`:'')+`<button class="btn sm on" data-toggle="${b.k}">Add</button>`)).join(''):'<div class="row note">Everyone is on your team.</div>'}</div></div>
<div class="card" style="padding:18px;--c:${d.col}"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="art" style="height:auto;padding:6px 10px">${d.big}</div><div><div class="role">${d.role}</div><h2 style="font-size:22px">${d.name}</h2><div class="note">${S.team.has(d.k)?'On your team':'Not on your team'}</div></div></div><p style="color:#3c4540">${d.desc}</p>
<div class="eyebrow">What it can do</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px">${d.can.map(x=>`<span class="ask">${x}</span>`).join('')}</div><div class="eyebrow">What it may read</div><div style="margin:8px 0 14px;display:flex;gap:6px;flex-wrap:wrap">${chips(d)}</div><div class="eyebrow">What it may draft</div><p class="note" style="margin:8px 0 0">Jira issues, Confluence pages and Slack replies. Every one waits for your approval. It never sends on its own.</p></div></div>`;}
function render(){nav();document.getElementById('view').innerHTML=({pick,today,bots})[S.view]();}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-toggle],[data-menu],[data-ask],[data-fill],[data-send],[data-detail],[data-review]');if(!t){if(S.menu){S.menu=false;render();}return;}
 if(t.dataset.go){S.view=t.dataset.go;S.menu=false;}
 else if(t.dataset.toggle){const k=t.dataset.toggle;if(S.team.has(k)){S.team.delete(k);if(S.asking===k)S.asking='nudge';toast(by(k).name+' removed from your team');}else{S.team.add(k);S.detail=k;toast(by(k).name+' added to your team');}}
 else if('menu' in t.dataset){S.menu=!S.menu;}
 else if(t.dataset.ask){const k=t.dataset.ask;if(!S.team.has(k)){S.team.add(k);toast(by(k).name+' added to your team');}S.asking=k;S.menu=false;}
 else if(t.dataset.fill){render();document.getElementById('q').value=t.dataset.fill;document.getElementById('q').focus();return;}
 else if('send' in t.dataset){const q=document.getElementById('q').value.trim()||by(S.asking).asks[0];S.drafts.unshift(['Confluence',q.replace(/\?$/,''),'Draft · just now · prototype, no model ran',S.asking]);toast(by(S.asking).name+' drafted it. Nothing is sent until you approve.');}
 else if(t.dataset.detail){S.detail=t.dataset.detail;}
 else if('review' in t.dataset){toast('In the real app this opens the draft workspace.');return;}
 render();});
render();
</script>
