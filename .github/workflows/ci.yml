name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmos
          POSTGRES_PASSWORD: pmos
          POSTGRES_DB: pmos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The Postgres store tests fail in CI if this is missing (see tests/common/mod.rs).
      PMOS_TEST_DATABASE_URL: postgresql://pmos:pmos@localhost:5432/pmos_test
      # Agent Governance keeps its own database and role, never PM OS's
      # (docs/agent-governance-spec.md §9). Its Postgres tests fail in CI without this.
      GOV_TEST_DATABASE_URL: postgresql://governance:governance@localhost:5432/governance_test
    steps:
      - uses: actions/checkout@v4
      - name: Agent Governance's test database
        env:
          PGPASSWORD: pmos
        run: |
          psql -h localhost -U pmos -d pmos_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE governance LOGIN PASSWORD 'governance'" \
            -c "CREATE DATABASE governance_test OWNER governance"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  content:
    name: Content lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -q -p pmos -- lint --root content
      # The eval files: categories, tasks, the taxonomy, judges and every tag used
      # (docs/evals.md). The benchmark runs themselves are the eval gate (evals-gate.yml).
      - run: cargo run --locked -q -p pmos-evals -- check --root evals --content content
      # Every bot's OpenShell policy is current and keeps the 0f rules (docs/sandbox-policies.md).
      - run: cargo run --locked -q -p pmos -- policy check --root content --policies policies
      # No doc or comment still promises that prompts stay on local models (any-host spec §3.9).
      - name: Model promises
        run: scripts/check-model-promises.sh --self-test && scripts/check-model-promises.sh

  # OpenShell's policy prover beside `pmos policy check` (docs/openshell-prover-and-sandbox-audit-
  # spec.md, slice A2). Every bot's policy is proved against the base branch's hand-written
  # boundary with the prover pinned in deploy/openshell-prover.lock; a change to the boundary must
  # come alone. The prover is built from the pinned SOURCE commit (the job fails if the fetched
  # tag is any other commit) with Z3 vendored (built from the z3-src crate that the source's
  # Cargo.lock pins by checksum; prebuilt-z3 would download an unpinned Z3 inside a build script).
  # The build runs offline with an empty environment; the job has no secrets and no write token,
  # and the checkout keeps no credentials. If the prover can't be fetched, built or checked, every
  # bot is `not_available` and the job FAILS with "prover not available": a proof that didn't run
  # is never a pass. The Cargo target of the build is cached by the pinned commit, so the long Z3
  # build runs once per commit and runner image.
  policy-prover:
    name: Policy prover (OpenShell, pinned)
    runs-on: ubuntu-24.04
    # A cold build compiles Z3 from C++ (about 10 to 25 minutes on a hosted runner, unverified).
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      # Where the prover is built and the proof record written (the runner's temp directory; the
      # `runner` context isn't available in a job's `env`).
      - name: Work directories
        run: |
          echo "PMOS_PROVER_DIR=$RUNNER_TEMP/openshell-prover" >>"$GITHUB_ENV"
          echo "PMOS_PROOF_RECORD=$RUNNER_TEMP/policy-proof.json" >>"$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The pinned prover source (deploy/openshell-prover.lock)
        id: pin
        run: |
          commit=$(awk -F= '$1 == "PROVER_SOURCE_COMMIT" { print $2; exit }' deploy/openshell-prover.lock)
          feature=$(awk -F= '$1 == "PROVER_Z3_FEATURE" { print $2; exit }' deploy/openshell-prover.lock)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || commit=none
          [[ "$feature" =~ ^[a-z0-9-]+$ ]] || feature=none
          image=${ImageOS:-unknown}
          [[ "$image" =~ ^[A-Za-z0-9._-]+$ ]] || image=unknown
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "feature=$feature" >>"$GITHUB_OUTPUT"
          echo "image=$image" >>"$GITHUB_OUTPUT"
      # The key holds the commit, which fixes the Rust toolchain too (its rust-toolchain.toml).
      - name: Restore the prover build (by commit, Z3 feature and runner image)
        id: prover-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PMOS_PROVER_DIR }}/new/target
          key: openshell-prover-${{ runner.os }}-${{ steps.pin.outputs.image }}-${{ runner.arch }}-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.feature }}-v1
      - name: The job's own checks (stand-in prover and stand-in builds)
        run: scripts/test-policy-prover-ci.sh
      - name: Build the pinned prover and prove every bot's policy
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            scripts/policy-prover-ci.sh --base "origin/$BASE_REF"
          else
            scripts/policy-prover-ci.sh
          fi
      # Saved even when the proof fails, so a failing pull request doesn't rebuild Z3 every run.
      - name: Save the prover build
        if: always() && steps.pin.outputs.commit != 'none' && steps.prover-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PMOS_PROVER_DIR }}/new/target
          key: ${{ steps.prover-cache.outputs.cache-primary-key }}
      - name: The proof record (prover version, SHA-256, source commit, every result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-proof
          path: ${{ env.PMOS_PROOF_RECORD }}
          if-no-files-found: warn

  harness:
    name: Harness (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: web
        run: pnpm typecheck
      - working-directory: web
        run: pnpm lint
      - working-directory: web
        run: pnpm test
      - working-directory: web
        run: pnpm build
      # Browser end-to-end tests (web/e2e). The browser is installed for the pinned
      # @playwright/test version; pnpm e2e starts its own dev server on port 5191.
      - name: Install Chromium for Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web
        run: pnpm e2e
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy kit (images, stack, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts parse
        run: for f in deploy/setup.sh deploy/pmos-admin deploy/postgres-init.sh deploy/preflight.sh deploy/pmos-metadata-block deploy/sandbox-create.sh scripts/claude-test-stack.sh scripts/test-pmos-admin.sh scripts/test-preflight.sh policies/redteam/lib.sh policies/redteam/isolation.sh policies/redteam/exposure.sh policies/redteam/stack.sh scripts/test-redteam.sh scripts/check-nginx-examples.sh scripts/policy-prover-ci.sh scripts/test-policy-prover-ci.sh scripts/build-openshell-prover.sh deploy/test/stand-ins/openshell-prover; do bash -n "$f"; done
      - name: pmos-admin checks (the eval gate's arguments; the checkout stays data)
        run: scripts/test-pmos-admin.sh
      # docs/openshell-any-host-spec.md §5 (slice H7): the red-team scripts' dry runs, refusals,
      # skips and traps, against stand-ins (nothing here reaches OpenShell, Docker or the host).
      - name: Red-team scripts (dry runs and stand-ins)
        run: |
          shellcheck -S warning -x policies/redteam/*.sh scripts/test-redteam.sh
          scripts/test-redteam.sh
      # docs/openshell-any-host-spec.md §6 (slice H1): every preflight check, pass and fail, on the
      # fixture hosts in deploy/test/preflight/; it also runs the Landlock probe on this runner
      # and prints its answer (not asserted: it depends on the runner's kernel).
      - name: Host preflight checks (fixtures)
        run: scripts/test-preflight.sh
      - name: nginx examples (nginx -t, where the runner has nginx; slice H10)
        run: scripts/check-nginx-examples.sh
      - name: Settings
        # `local` with the stub model (env.example's PMOS_GATEWAY_STUB=1): no GPU and no hosted
        # endpoint here. setup.sh's default, hosted-test, needs a provider's URL and key
        # (slice H4). The repository's content carries content/TEST-CONTENT, which the bring-up
        # workers need.
        run: deploy/setup.sh --content "$GITHUB_WORKSPACE" --state "$RUNNER_TEMP/pmos-state" --model-source local
      - run: docker compose -f deploy/compose.yaml --env-file deploy/.env config -q
      - name: Images
        run: deploy/pmos-admin build
      - name: Stack up (stub model, fake connectors, bring-up worker)
        run: |
          # Prepared as an operator prepares a host before the first `up` (docs/runbooks/install.md,
          # Stage 2), since `up` runs every host check (docs/openshell-any-host-spec.md §3.2):
          # H-NAMES needs the managed block in /etc/hosts (slice H2), and the runner is a cloud
          # VM, so H-METADATA fails while a container can reach its metadata service; the
          # generic fix is the block (slice H1).
          sudo deploy/pmos-admin host-names apply
          deploy/pmos-admin host-names check
          sudo deploy/pmos-admin host-firewall apply
          deploy/pmos-admin up --bringup
          for i in $(seq 1 30); do deploy/pmos-admin status | grep -Eq '^ +bots +ok' && break; sleep 5; done
          deploy/pmos-admin status
          # Slice H12 (docs/openshell-any-host-spec.md §3.6): the release image's gateway carries
          # the release list, byte for byte the committed (empty) one, never the test-only list.
          ready=$(curl -sS --noproxy '*' http://127.0.0.1:8740/readyz)
          want=$(sha256sum <crates/gateway/approved-hosted.yaml | cut -d' ' -f1)
          python3 -I -c 'import json,sys
          d = json.loads(sys.argv[1])
          assert d["approved_list"] == "release", d
          assert d["approved_list_sha256"] == sys.argv[2], d' "$ready" "$want"
      - name: A member and a Docs-bot task end to end
        run: |
          # Every service decides from the user database (there is no team file since slice
          # U7): the CI person is imported into the stack's empty database, then gets a
          # personal bot in the content.
          deploy/pmos-admin users import --from deploy/test/ci-users.yaml --bootstrap --apply
          deploy/pmos-admin pmos bot add-personal --root content --handle ci
          deploy/pmos-admin pmos policy generate --root content --out policies
          deploy/pmos-admin lint
          deploy/pmos-admin reindex
          sleep 35   # the bot runtime reloads the catalog within 30 seconds
          deploy/pmos-admin smoke ci
      - name: Backup
        run: deploy/pmos-admin backup
      - name: Logs on failure
        if: failure()
        run: for s in toolserver gateway bots worker-docs docs; do deploy/pmos-admin logs "$s" || true; done
