name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmos
          POSTGRES_PASSWORD: pmos
          POSTGRES_DB: pmos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The Postgres store tests fail in CI if this is missing (see tests/common/mod.rs).
      PMOS_TEST_DATABASE_URL: postgresql://pmos:pmos@localhost:5432/pmos_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  content:
    name: Content lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -q -p pmos -- lint --root content

  harness:
    name: Harness (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
