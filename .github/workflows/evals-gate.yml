name: Eval gate

# The eval gate (docs/evals.md, "The gate"): a change to a bot's role, skills or bot file, to
# the evals, or to the gateway's model config must not make the benchmarks worse. Every one of
# these paths runs every category (owner, 2026-11-23; `pmos-evals affected`): a change tuned
# for one bot can regress another, and skills are shared across personas. A full run is every
# task times its repeats (103 tasks x 3 = 309 attempts on 2026-11-23), one model call at a time
# on the eval stack, which can outlast `timeout-minutes` below.
#
# RUNNER TO BE DECIDED: the `pmos-spark` label below is from the earlier Spark plan. The owner
# dropped the Spark as a deployment target on 2026-11-22, so where this runner lives is still
# to be decided (docs/evals.md, "CI"); it must be a host the improver's sandbox cannot reach.
# The label is left as it is until then. The rest of this comment describes the Spark setup.
#
# It runs on the Spark, where the runtime, the worker and the models are; registering that runner is in
# docs/runbooks/upgrade.md. Until one is registered this job waits in the queue, and a platform
# owner runs `deploy/pmos-admin evals-gate` by hand and pastes the result into the PR.
#
# Why this is safe to run on the Spark, beside production secrets:
# - **The workflow and the script are trusted copies.** `pull_request_target` runs this file
#   as it is on the base branch, never the PR's version of it. The Gate step runs the Spark's
#   installed `pmos-admin` (PMOS_SPARK_DIR, default /opt/pmos), never the PR's copy, so a
#   change to the script only takes effect after it is merged and the Spark is upgraded.
# - **The PR is data.** Its head is checked out into `pr/` without credentials. Nothing in
#   `pr/` is sourced or executed: `pmos-admin evals-gate --checkout pr` only runs git on it
#   (diff and archive) and reads `content/`, `evals/` and `deploy/gateway.yaml` from it, in
#   the eval stack's containers, which run the Spark's installed images. No secret file is
#   linked into the checkout.
# - **Only branches of this repository run here,** never forks; the runner is restricted to
#   this repository and outside collaborators need an approval to run Actions
#   (docs/runbooks/upgrade.md).

on:
  pull_request_target:
    paths:
      - "content/skills/**"
      - "content/roles/**"
      - "content/bots/**"
      - "evals/**"
      - "deploy/gateway.yaml"

permissions:
  contents: read

concurrency:
  group: evals-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Eval gate (Spark)
    # Only PRs from branches of this repository run here, never from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pmos-spark]
    timeout-minutes: 240
    steps:
      # The PR's head, as data. Keep no credentials in its git config.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          # The gate compares with the base branch's reports and diffs against it.
          fetch-depth: 0
      # The base branch, inside pr/ (pmos-admin runs `git -C pr diff` and `git -C pr archive`).
      # The token goes to git through its environment for this one fetch, never into pr/.
      - name: Base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git -C "$GITHUB_WORKSPACE/pr" fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          "${PMOS_SPARK_DIR:-/opt/pmos}/deploy/pmos-admin" evals-gate \
            --checkout "$GITHUB_WORKSPACE/pr" --base "origin/${BASE_REF}" \
            | tee "$RUNNER_TEMP/evals-gate.md"
      - name: Summary
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/evals-gate.md" ]; then
            cat "$RUNNER_TEMP/evals-gate.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The eval gate produced no summary; see the Gate step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
