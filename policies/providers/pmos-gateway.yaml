# Generated by `pmos policy generate`. NVIDIA OpenShell provider profile.
# Endpointless on purpose: a credential resolves only where a bot's own policy
# binds its own instance (`credential_binding.provider: pmos-<bot>-...`).
# Import once on PM OS's host (verify the command there):
#   openshell provider profile lint -f policies/providers/pmos-gateway.yaml
#   openshell provider profile import -f policies/providers/pmos-gateway.yaml --global
category: inference
credentials:
  - auth_style: bearer
    description: "The bot's own entry in the gateway's PMOS_GATEWAY_TOKENS (bot-<bot>=...)"
    env_vars:
      - PMOS_GATEWAY_TOKEN
    name: gateway_token
    required: true
description: "One bot's client token for the PM OS model gateway. Endpointless: each bot's policy binds its own instance to gateway.pmos.internal:8740."
display_name: "PM OS gateway"
id: pmos-gateway
inference_capable: true
