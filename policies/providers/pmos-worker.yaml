# Generated by `pmos policy generate`. NVIDIA OpenShell provider profile.
# Endpointless on purpose: a credential resolves only where a bot's own policy
# binds its own instance (`credential_binding.provider: pmos-<bot>-...`).
# Import once on the Spark (verify the command there):
#   openshell provider profile lint -f policies/providers/pmos-worker.yaml
#   openshell provider profile import -f policies/providers/pmos-worker.yaml --global
category: other
credentials:
  - auth_style: bearer
    description: "The bot's own entry in the runtime's PMOS_BOTS_TOKENS (worker-<bot>=...)"
    env_vars:
      - PMOS_WORKER_TOKEN
    name: worker_token
    required: true
description: "One bot's worker client token for the PM OS bot runtime; it may claim only that bot's tasks. Endpointless: each bot's policy binds its own instance to bots.pmos.internal:8750."
display_name: "PM OS bot runtime worker"
id: pmos-worker
inference_capable: false
