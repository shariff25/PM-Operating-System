# Generated by `pmos policy generate`. NVIDIA OpenShell provider profile.
# Endpointless on purpose: a credential resolves only where a bot's own policy
# binds its own instance (`credential_binding.provider: pmos-<bot>-...`).
# Import once on the Spark (verify the command there):
#   openshell provider profile lint -f policies/providers/pmos-session.yaml
#   openshell provider profile import -f policies/providers/pmos-session.yaml --global
category: other
credentials:
  - auth_style: bearer
    description: "The session for the bot's current task; the bot runtime rotates the value per task with `openshell provider update`"
    env_vars:
      - PMOS_SESSION_TOKEN
    name: session_token
    required: true
    stable_placeholder: true
description: "One bot's tool-server session token. Endpointless: each bot's policy binds its own instance to toolserver.pmos.internal:8710/mcp."
display_name: "PM OS tool-server session"
id: pmos-session
inference_capable: false
