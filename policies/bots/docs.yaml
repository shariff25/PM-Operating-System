# Generated by `pmos policy generate` from bots/docs/BOT.md and roles/docs-helper/ROLE.md.
# Do not edit by hand: change the bot or its role, regenerate, and commit both.
# `pmos policy check` fails on any difference. A network change needs a second
# platform-owner PM's review (POL-2); see policies/README.md.
# Format: NVIDIA OpenShell sandbox policy, version 1. Values still to verify on the
# Spark (worker binary path, /sandbox layout, MCP revisions) are listed in
# docs/sandbox-policies.md. Launch flags are in docs.sandbox.yaml.
filesystem_policy:
  include_workdir: false
  read_only:
    - /app
    - /dev/urandom
    - /etc
    - /lib
    - /proc
    - /sandbox/master/AGENTS.md
    - /sandbox/skills/docs
    - /usr
    - /var/log
  read_write:
    - /dev/null
    - /sandbox/workspace
    - /tmp
landlock:
  compatibility: hard_requirement
network_policies:
  pmos_gateway:
    binaries:
      - path: /usr/local/bin/node
    endpoints:
      - credential_binding:
          provider: pmos-docs-gateway
        enforcement: enforce
        host: gateway.pmos.internal
        port: 8740
        protocol: rest
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    name: pmos_gateway
  pmos_runtime:
    binaries:
      - path: /usr/local/bin/node
    endpoints:
      - credential_binding:
          provider: pmos-docs-worker
        enforcement: enforce
        host: bots.pmos.internal
        port: 8750
        protocol: rest
        rules:
          - allow:
              method: POST
              path: /v1/worker/claim
          - allow:
              method: POST
              path: "/v1/worker/tasks/*/complete"
          - allow:
              method: POST
              path: "/v1/worker/tasks/*/events"
          - allow:
              method: POST
              path: "/v1/worker/tasks/*/fail"
          - allow:
              method: POST
              path: "/v1/worker/tasks/*/heartbeat"
          - allow:
              method: POST
              path: "/v1/worker/tasks/*/trace"
    name: pmos_runtime
  pmos_toolserver:
    binaries:
      - path: /usr/local/bin/node
    endpoints:
      - enforcement: enforce
        host: toolserver.pmos.internal
        mcp:
          versions:
            - "2025-03-26"
            - "2025-06-18"
            - "2025-11-25"
        path: /mcp
        port: 8710
        protocol: mcp
        rules:
          - allow:
              method: initialize
          - allow:
              method: notifications/initialized
          - allow:
              method: tools/list
          - allow:
              method: tools/call
              tool:
                any:
                  - docs_read
                  - docs_search
    name: pmos_toolserver
process:
  run_as_group: sandbox
  run_as_user: sandbox
version: 1
