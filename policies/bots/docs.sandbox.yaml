# Generated by `pmos policy generate` from bots/docs/BOT.md and roles/docs-helper/ROLE.md.
# PM OS launch spec for sandbox pmos-docs: the only providers to attach
# (`--provider`) and the only content to upload (`--upload <from>:<to>`, from the
# content root). Do not edit by hand; `pmos policy check` fails on any difference.
bot: docs
policy: docs.yaml
providers:
  - credential: PMOS_GATEWAY_TOKEN
    name: pmos-docs-gateway
    profile: pmos-gateway
  - credential: PMOS_SESSION_TOKEN
    name: pmos-docs-session
    profile: pmos-session
role: docs-helper
sandbox: pmos-docs
scope: team
uploads:
  - from: master/AGENTS.md
    to: /sandbox/master/AGENTS.md
  - from: skills/docs
    to: /sandbox/skills/docs
workdir: /sandbox/workspace
