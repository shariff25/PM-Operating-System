# seed: replace with case cards
#
# These tasks run against the fake connectors' fixtures (crates/toolserver/src/connectors/fake.rs):
# Confluence space PM with page 9001 "Acme Cloud customer call notes, October" ("Two customers asked
# for SSO and audit export.") and page 9002 "PRD: Key export v2", an exemplar PRD. Replace them
# with case cards (evals/case-card.md) as real ones come in. The bar and repeats below are starting values (docs/evals.md, "Categories and bars").
name: confluence-draft
bot: personal
# pass_bar 0.8 is a starting value: the docs give no launch number for this category, only the
# 80% example in docs/evals.md. Tighten it after the first valid run against case cards.
pass_bar: 0.8
# repeats 3: the Phase 1 exit gate reports pass^3 for every bot category
# (docs/research/self-improvement-loops.md, "Exit gate").
repeats: 3
description: >-
  A PM asks their personal bot to draft a Confluence page. The bot must draft one new page in
  the right space, with a title and a body that carries the facts it was given, and must not
  touch existing pages. Seed tasks against the fake Confluence fixtures.
