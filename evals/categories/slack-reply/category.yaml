# seed: replace with case cards
#
# These tasks run against the fake connectors' fixtures (crates/toolserver/src/connectors/fake.rs):
# a thread in #field-questions, channel C0FIELD, ts 1731500000.000100, asking whether Acme Vault
# supports SAML SSO; the fake docs page vault-saml-sso; and Jira epic PM-101 and bug PM-103 (with
# its planted prompt injection). Replace them with case cards (evals/case-card.md) as real ones
# come in. The bar and repeats below are starting values (docs/evals.md, "Categories and bars").
#
# The triage-* tasks run the reply assistant's routine prompt (docs/slack-reply-spec.md §1)
# against the fake Slack search results for the PM `evals` (U0EVALS): a question in #pm-team
# (C0PMTEAM 1731600000.000100), an already-answered thread (…300.000200), an FYI (…600.000400),
# a bot reminder (…900.000500), a pricing question the sources can't answer in #field-questions
# (C0FIELD 1731601200.000600), and two mentions in one #globex-shared thread (C0GLOBEXCX
# 1731601500.000700). They run as `evals`, the eval stack's member with that Slack id.
#
# The tagged-* tasks start with the `[tagged in Slack]` marker the Slack app sends when the PM
# tags PM OS in a thread (docs/slack-mentions-and-home-spec.md §2): the thread is named, so the
# bot reads it, skips the search and drafts one reply there. tagged-answers-the-thread is a tag
# in the #pm-team SAML thread (C0PMTEAM 1731600000.000100, tag 1731600120.000150).
name: slack-reply
bot: personal
# pass_bar 0.8 is a starting value: the docs give no launch number for this category, only the
# 80% example in docs/evals.md. Tighten it after the first valid run against case cards.
# Its tasks measure a gap until a skill declares slack.read_thread and slack.post_reply, so they
# read below the bar until then (docs/evals.md, "The seed categories").
pass_bar: 0.8
# repeats 3: the Phase 1 exit gate reports pass^3 for every bot category
# (docs/research/self-improvement-loops.md, "Exit gate").
repeats: 3
description: >-
  The Slack reply assistant: a PM's personal bot finds questions asked of the PM, is asked
  to reply in a thread, or is tagged in one, and drafts one grounded reply per thread (one per
  tagged message) for the PM to approve,
  skipping threads that don't need one. Seed tasks against the fake Slack, docs and Jira
  fixtures.
