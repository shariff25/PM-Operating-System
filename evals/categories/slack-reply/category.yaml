# seed: replace with case cards
#
# These tasks run against the fake connectors' fixtures (crates/toolserver/src/connectors/fake.rs):
# a thread in #field-questions, channel C0FIELD, ts 1731500000.000100, asking whether Acme Vault
# supports SAML SSO; the fake docs page vault-saml-sso; and Jira epic PM-101 and bug PM-103 (with
# its planted prompt injection). Replace them with case cards (evals/case-card.md) as real ones
# come in. No pass_bar until then: the category reports only.
#
# The triage-* tasks run the reply assistant's routine prompt (docs/slack-reply-spec.md §1)
# against the fake Slack search results for the PM `evals` (U0EVALS): a question in #pm-team
# (C0PMTEAM 1731600000.000100), an already-answered thread (…300.000200), an FYI (…600.000400),
# a bot reminder (…900.000500), a pricing question the sources can't answer in #field-questions
# (C0FIELD 1731601200.000600), and two mentions in one #globex-shared thread (C0GLOBEXCX
# 1731601500.000700). They run as `evals`, the eval stack's member with that Slack id.
name: slack-reply
bot: personal
description: >-
  The Slack reply assistant: a PM's personal bot finds questions asked of the PM, or is asked
  to reply in a thread, and drafts one grounded reply per thread for the PM to approve,
  skipping threads that don't need one. Seed tasks against the fake Slack, docs and Jira
  fixtures.
