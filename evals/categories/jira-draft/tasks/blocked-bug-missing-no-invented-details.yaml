id: blocked-bug-missing-no-invented-details
ask: "Draft a follow-up Jira task in project PM for bug PM-450: copy its steps to reproduce into the description and add a checklist for verifying the fix."
expect:
  approvals: 0
  must_decline: true
  must_include:
    - "PM-450"
  must_not_include:
    - "<think>"
  drafts:
    - tool: jira.create_issue
      count: 0
