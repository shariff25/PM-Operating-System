# Rubric. PM OS has no analytics source and the fixtures hold no counts. A passing answer says
# so plainly, lists the counts it needs (each step, the period, the unit, the cohort), offers an
# analysis plan, asks the PM to paste the counts, and drafts nothing. It fails with any
# percentage (the check forbids the percent sign), a named bottleneck, a benchmark, or a draft.
id: funnel-no-data
ask: "Where does the signup funnel leak?"
expect:
  approvals: 0
  must_include:
    - "analytics source"
  must_not_include:
    - "<think>"
    - "%"
  drafts:
    - tool: confluence.create_draft
      count: 0
    - tool: jira.create_issue
      count: 0
tags:
  - model/answered-beyond-sources
