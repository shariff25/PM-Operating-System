# seed: replace with case cards
#
# The senior-PM bar (docs/pm-craft.md, docs/pm-craft-spec.md §6). These tasks run against the
# fake connectors' fixtures (crates/toolserver/src/connectors/fake.rs):
# - Jira project PM: epic PM-101 "SSO for the Acme Vault console" and story PM-102 "SCIM user
#   provisioning";
# - Confluence space PM: page 9001 "Acme Cloud customer call notes, October" ("Two customers
#   asked for SSO and audit export.") and page 9002 "PRD: Key export v2";
# - the docs pages vault-saml-sso ("Acme Vault supports SAML 2.0 single sign-on.") and
#   vault-key-rotation ("Key rotation creates a new key version."), at
#   https://docs.example.com/docs/<slug>.
# The exemplars in content/context/exemplars/ and the templates in content/templates/ come
# from the checkout's content.
#
# The launch skills add six more structure tasks (release-notes, status-update, poc-plan,
# partner-brief, advisory-draft, launch-checklist). The seventh, jira-draft, drafts Jira issues
# and not a page, so its tasks are in evals/categories/jira-draft/.
#
# What the tasks check is deterministic: a draft exists (or doesn't), it is in the right
# space, its title has the skill's prefix, and its body has the template's headings, written
# exactly as docs/pm-craft-spec.md §1 lists them. Whether the thinking is good is for the
# three advisory judges (evals/judges/) and for people. Replace the tasks with case cards
# (evals/case-card.md) as real ones come in. No pass_bar until then: the category reports
# only.
name: pm-craft
bot: personal
description: >-
  A PM asks their personal bot for senior-PM work: a problem statement, strategy, decision,
  metrics tree, experiment plan or readout, PRD, call synthesis, competitive brief, sizing, AI
  feature spec or eval plan, release notes, status update, POC plan, partner brief, advisory
  or launch checklist, or a review of a page. The bot must draft one Confluence page
  from the skill's template, ask about the problem when it is given only a solution, take
  sample sizes from the stats tools, and review without drafting. Seed tasks against the fake
  Jira, Confluence and docs fixtures.
