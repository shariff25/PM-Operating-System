# seed: replace with case cards
# Fixtures: epic PM-101, story PM-102 and page 9001. The strategy-doc skill titles its draft
# `Strategy: …` and follows content/templates/strategy-doc.md: Recommendation, Diagnosis,
# Guiding choice, What we will do, What we won't do, Alternatives considered, Risks, How we'll
# know.
id: structure-strategy-doc
ask: "Draft anyway, no questions: a strategy doc in the PM space for enterprise identity in the Acme Vault console (SAML SSO and SCIM), from Jira epic PM-101, story PM-102 and the October Acme Cloud call notes (Confluence page 9001)."
expect:
  approvals: 1
  must_not_include:
    - "<think>"
  drafts:
    - tool: confluence.create_draft
      count: 1
      require_fields: [space, title, body]
      allowed:
        space: [PM]
      must_include: ["Strategy:", "Diagnosis", "Guiding choice", "What we will do", "What we won't do", "Alternatives considered"]
      must_not_include: ["<think>", "TODO", "<!--"]
cluster: strategy-doc
tags:
  - model/draft-content
