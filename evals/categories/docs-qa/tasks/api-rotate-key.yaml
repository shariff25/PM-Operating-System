# Checked against https://support.fortanix.com/apidocs/rotate-a-security-object on 2026-11-14.
# The page says: POST /crypto/v1/keys/rekey renames the current key to '<current_name> (rotated at <timestamp>)' and generates a new key with the original name.
id: api-rotate-key
ask: "In the DSM REST API, which endpoint rotates a key, and what happens to the old key's name?"
expect:
  must_cite:
    - https://support.fortanix.com/apidocs/rotate-a-security-object
  must_include:
    - "/crypto/v1/keys/rekey"
    - "rotated at"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
