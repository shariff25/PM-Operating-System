# Checked against https://support.acme.com/docs/which-container-registries-does-acme-ccm-support on 2026-11-14.
# The page says: every registry that can be publicly accessed using password-based authentication, such as Docker Hub, ECR and ACR.
id: ccm-container-registries
ask: "Which container registries can Acme CCM pull application images from?"
expect:
  must_cite:
    - https://support.acme.com/docs/which-container-registries-does-acme-ccm-support
  must_include:
    - "password"
    - "Docker Hub"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
