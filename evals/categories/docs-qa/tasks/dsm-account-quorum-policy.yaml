# The page says: rules can require quorum group members, a minimum number of administrators, an application, a second-factor key or password re-entry; account requests expire after 10 days by default.
id: dsm-account-quorum-policy
ask: "In a DSM account quorum approval policy, what kinds of approvers can a rule require, and when does an account quorum approval request expire by default?"
expect:
