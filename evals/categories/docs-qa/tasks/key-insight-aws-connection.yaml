# Checked against https://support.acme.com/docs/acme-key-insight-getting-started-with-aws-connection on 2026-11-14.
# The page says: AWS supports the secret-based and federated authentication methods; IP whitelisting is not mandatory.
id: key-insight-aws-connection
ask: "What authentication methods can I use to connect an AWS account to Acme Key Insight, and is IP whitelisting required?"
expect:
  must_cite:
    - https://support.acme.com/docs/acme-key-insight-getting-started-with-aws-connection
  must_include:
    - "secret-based"
    - "federated"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
