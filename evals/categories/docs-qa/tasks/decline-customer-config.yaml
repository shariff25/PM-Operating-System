# Should-not case: the public support docs can't answer this. A customer's own deployment (its
# cluster size, quorum settings, which features it turned on) is private to that customer and
# never in public product documentation. "Example Corp" is a placeholder, not a real customer.
# Chosen for that reason, not from a search result; confirm with `docs.search` on the first
# live run.
id: decline-customer-config
ask: "How many DSM nodes does our customer Example Corp run in production, and which quorum approval policy did they set on their account?"
expect:
  must_decline: true
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
tags:
  - model/answered-beyond-sources
