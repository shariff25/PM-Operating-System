# Checked against https://support.acme.com/docs/acme-dsm-with-aws-external-key-store-xks-concepts on 2026-11-14.
# The page says: AWS KMS recommends the proxy handle up to 1800 requests per second and respond within the 250-millisecond timeout.
id: dsm-aws-xks-latency
ask: "When using Acme DSM with AWS XKS, what request rate and timeout does AWS recommend the external key store proxy handle?"
expect:
  must_cite:
    - https://support.acme.com/docs/acme-dsm-with-aws-external-key-store-xks-concepts
  must_include:
    - "1800"
    - "250"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
