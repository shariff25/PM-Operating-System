# Checked against https://support.fortanix.com/docs/dsm-algorithm-support-strict-fips-mode on 2026-11-14.
# The page says: RSA keys between 2048 and 8192 bits; only exponent 65537 is allowed.
id: dsm-strict-fips-rsa
ask: "In DSM strict FIPS mode, what RSA key sizes are supported and which public exponent is allowed?"
expect:
  must_cite:
    - https://support.fortanix.com/docs/dsm-algorithm-support-strict-fips-mode
  must_include:
    - "2048"
    - "8192"
    - "65537"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
