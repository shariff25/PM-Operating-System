# Checked against https://support.fortanix.com/docs/fortanix-data-security-manager-port-requirements on 2026-11-14.
# The page says: applications use 443 (HTTPS, WebUI and REST API) and 5696 (KMIP); 4445 serves static WebUI content.
id: dsm-port-requirements
ask: "Which ports do applications need open to reach an on-premises Fortanix DSM cluster, and which one is for KMIP?"
expect:
  must_cite:
    - https://support.fortanix.com/docs/fortanix-data-security-manager-port-requirements
  must_include:
    - "443"
    - "5696"
    - "KMIP"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
