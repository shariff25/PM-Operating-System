# Checked against https://support.acme.com/docs/acme-saas-ip-whitelisting on 2026-11-14.
# The page says: new IPs are announced at https://ip-ranges.acme.com/ip-ranges at least 30 days before use.
id: saas-ip-ranges
ask: "Where does Acme publish the SaaS IP ranges a customer should allowlist, and how much notice is given before new IPs are used?"
expect:
  must_cite:
    - https://support.acme.com/docs/acme-saas-ip-whitelisting
  must_include:
    - "ip-ranges.acme.com"
    - "30 days"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
