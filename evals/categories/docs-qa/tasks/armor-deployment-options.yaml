# Checked against https://support.fortanix.com/docs/fortanix-armor-deployment-options on 2026-11-14.
# The page says: Armor is offered as SaaS, on a customer-managed AKS environment, or on-premises Kubernetes.
id: armor-deployment-options
ask: "What deployment options does Fortanix Armor support?"
expect:
  must_cite:
    - https://support.fortanix.com/docs/fortanix-armor-deployment-options
  must_include:
    - "SaaS"
    - "AKS"
    - "on-prem"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
