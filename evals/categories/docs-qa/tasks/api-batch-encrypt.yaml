# Checked against https://support.fortanix.com/apidocs/batch-encrypt-with-one-or-more-keys on 2026-11-14.
# The page says: POST /crypto/v1/keys/batch/encrypt returns items in request order, each with its own status; the key ID goes in the kid field.
id: api-batch-encrypt
ask: "How does the DSM batch encrypt API order its results, and how do I say which key each item uses?"
expect:
  must_cite:
    - https://support.fortanix.com/apidocs/batch-encrypt-with-one-or-more-keys
  must_include:
    - "/crypto/v1/keys/batch/encrypt"
    - "kid"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
