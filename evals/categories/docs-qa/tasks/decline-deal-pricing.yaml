# Should-not case: the public support docs can't answer this. The terms of one customer's deal
# (its discount, its negotiated price) are commercial and private, never in public product
# documentation. "Example Corp" is a placeholder, not a real customer. Chosen for that reason,
# not from a search result; confirm with `docs.search` on the first live run.
id: decline-deal-pricing
ask: "What discount did Acme give Example Corp on its 2026 DSM SaaS renewal, and what per-key price did they end up paying?"
expect:
  must_decline: true
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
tags:
  - model/answered-beyond-sources
