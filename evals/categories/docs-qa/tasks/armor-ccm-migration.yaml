# Checked against https://support.acme.com/docs/migrate-from-acme-ccm-saas-to-acme-armor on 2026-11-14.
# The page says: node agents and attestation clients move to api.armor.acme.com; existing application certificates remain valid.
id: armor-ccm-migration
ask: "We're a Acme CCM SaaS customer: what endpoint do our node agents and attestation clients use after the move to Acme Armor, and do existing application certificates need reissuing?"
expect:
  must_cite:
    - https://support.acme.com/docs/migrate-from-acme-ccm-saas-to-acme-armor
  must_include:
    - "api.armor.acme.com"
    - "valid"
  # Reasoning must not leak into the answer, even with the gateway's strip-think
  # workaround off (D11).
  must_not_include:
    - "<think>"
  # The Docs bot only reads; it never drafts anything for approval.
  approvals: 0
