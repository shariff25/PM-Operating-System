name: docs-qa
bot: docs
# 80% of attempts. D10: the category launches once it meets this two weeks in a row.
pass_bar: 0.8
# Each task runs three times, so the report shows pass^3 and a standard error, and the gate
# can tell a real drop from noise.
repeats: 3
description: >-
  Questions a Fortanix PM asks about DSM, CCM, Confidential AI, Key Insight, Armor and the DSM
  REST API, each answered by one public support.fortanix.com page. The Docs bot must cite that
  page and state the facts on it. Every expectation was checked against the page on 2026-11-14.
  Three more questions (decline-*) ask for what the public docs don't hold, such as roadmap
  dates, a customer's own setup and deal pricing; the bot must say its sources don't answer
  them.
